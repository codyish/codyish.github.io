### Site Settings ###
title               : Data Midden
description         : >-
                      mid·den (mĭd′n) - A mound or deposit containing shells, animal bones, and other refuse that indicates the site of a human settlement. A useful resource for archaeologists
url                 : https://www.datamidden.com        # Canonical origin; used for absolute URLs
baseurl             : ""                                # Site is served at the domain root (www.datamidden.com)
repository          : codyish/codyish.github.io         # Used by jekyll-github-metadata for remote projects
open_new_tab        : false                             # Opens external URLs in new tab (works for posts, projects and navbar only)

# Theme is vendored into this repo (_layouts, _includes, _sass) rather than
# pulled with remote_theme. See THEME.md at the repo root for provenance and
# how to re-sync with upstream.


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md


### Author Info ###
author:
  name              : Cody Stephenson
  image             : assets/crop_again0.jpg
# behance           : your_username
# dribbble          : your_username
# email             : username@domain.com
# facebook          : your_username
  github            : codyish
# gitlab            : your_username
# instagram         : your_username
  kaggle            : codyish
# linkedin          : your_username
# medium            : your_username
# soundcloud        : your_username
# spotify           : your_username
# stackoverflow     : your_user_id
# tumblr            : your_username.tumblr.com
# twitch            : your_username
# twitter           : your_username
# vimeo             : your_username
# youtube           : your_channel_name
# keybase           : your_username


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name


### Disqus ###
disqus:
  shortname: your-short-name-disqus                     # Your website Shortname on disqus


### Analytics ###
analytics:
  enabled: true                                         # Set false to disable all analytics
  goatcounter:
    endpoint: https://datamidden.goatcounter.com/count  # Same account the Bayes Box app reports to
# google:                                               # Uncomment with a real ID to also load gtag.js
#   tracking_id: G-XXXXXXXXXX


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false                                   # Set to true to enable disqus comments


### Exclude from processing ###
# NOTE: defining this key replaces Jekyll's built-in defaults, so local build
# artifacts (vendor/, .bundle/, Gemfile) must be listed explicitly or they get
# copied into the published site.
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - vendor
  - .bundle
  - Gemfile
  - Gemfile.lock
  - "*.log"
